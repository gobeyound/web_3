<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study Details | Blink Beyond</title>
  <meta name="description" content="Read detailed case study breakdown, strategy, key deliverables, and measured business results.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/desktop/desktop.css">
  <link rel="stylesheet" href="css/tablet/tablet.css">
  <link rel="stylesheet" href="css/mobile/mobile.css">
  <link rel="stylesheet" href="css/casestudies.css">
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    (function() {
      try {
        var seen = localStorage.getItem('bb_loader_seen') === '1' || /(?:^|; )bb_loader_seen=1/.test(document.cookie);
        if (seen) {
          document.documentElement.classList.add('bb-loader-skip');
          document.documentElement.classList.add('loader-skip');
        } else {
          document.documentElement.classList.add('is-preloading');
        }
      } catch (e) {}
      try {
        if (sessionStorage.getItem('bb_page_transition') === '1') {
          document.documentElement.classList.add('bb-entering');
          document.documentElement.style.background = '#3D3DFF';
          document.documentElement.style.backgroundColor = '#3D3DFF';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page-transition-overlay"></div>

  <!-- MAIN CASE STUDY DETAIL CONTENT -->
  <main class="cs-page-wrapper" style="padding-top: 40px;">
    <div class="cs-container" id="csDetailContainer">
      <!-- Dynamically populated by JS -->
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/scrolltrigger.min.js"></script>
  <script src="js/casestudies-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('csDetailContainer');
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id') || 'webdev-1';

      const allProjects = window.CASE_STUDIES_DATA || [];
      const currentIndex = allProjects.findIndex(p => p.id === projectId);
      const project = currentIndex !== -1 ? allProjects[currentIndex] : allProjects[0];

      // Prev & Next project calculation
      const prevProject = currentIndex > 0 ? allProjects[currentIndex - 1] : allProjects[allProjects.length - 1];
      const nextProject = currentIndex < allProjects.length - 1 ? allProjects[currentIndex + 1] : allProjects[0];

      // Document title
      document.title = `${project.title} | Case Study — Blink Beyond`;

      const domainName = project.liveUrl ? project.liveUrl.replace(/^https?:\/\//, '').split('/')[0] : 'demo.blinkbeyond.co.in';

      // Dynamic project helpers
      const painPointsList = project.painPoints || [
        'Slow legacy load speeds impacting mobile conversion rate',
        'Outdated UI layout lacking modern brand identity',
        'Complex checkout/inquiry workflow dropping leads'
      ];

      const targetGoalsList = project.targetGoals || [
        'Achieve sub-second page loads (< 1s speed global)',
        'Modernize visual UX with responsive design',
        'Maximize client lead generation and conversion ROI'
      ];

      const workflowPhases = project.workflow || [
        { phase: 'PHASE 01', title: 'RESEARCH & UX', desc: 'User Journey Mapping & Wireframes' },
        { phase: 'PHASE 02', title: 'FULL STACK DEV', desc: 'Component Architecture & APIs' },
        { phase: 'PHASE 03', title: 'SPEED & SEO', desc: 'Lighthouse 100/100 Optimization' },
        { phase: 'PHASE 04', title: 'DEPLOYMENT', desc: 'Cloud Infrastructure & SSL' }
      ];

      const testimonialData = project.testimonial || {
        quote: 'Blink Beyond delivered exceptional speed, flawless design, and real business results. The team exceeded all our expectations!',
        author: 'Client Leadership Team',
        role: project.client
      };

      let html = `
        <!-- TOP INLINE BACK BUTTON & NAVIGATION -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
          <a href="casestudies.html?cat=${project.category}" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 30px; color: #ffffff; font-size: 13px; font-weight: 700; text-decoration: none; text-transform: uppercase; font-family: var(--font-display, 'Barlow Condensed', sans-serif); letter-spacing: 1px; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onmouseover="this.style.borderColor='#3D3DFF'; this.style.background='rgba(61,61,255,0.2)'; this.style.transform='translateX(-3px)';" onmouseout="this.style.borderColor='rgba(255, 255, 255, 0.18)'; this.style.background='rgba(255, 255, 255, 0.08)'; this.style.transform='none';">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span>Back to Case Studies</span>
          </a>

          <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #00ffaa; background: rgba(0,255,170,0.1); border: 1px solid rgba(0,255,170,0.25); padding: 6px 14px; border-radius: 20px;">
            <span class="webdev-live-dot"></span>
            <span>VERIFIED CASE STUDY</span>
          </div>
        </div>

        <!-- BREADCRUMB -->
        <nav class="cs-breadcrumb">
          <a href="index.html">Home</a>
          <span>/</span>
          <a href="casestudies.html">Case Studies</a>
          <span>/</span>
          <a href="casestudies.html?cat=${project.category}">${project.categoryName}</a>
          <span>/</span>
          <span style="color: #ffffff; font-weight: 600;">${project.title}</span>
        </nav>

        <!-- HERO HEADER -->
        <header class="cs-detail-hero">
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;">
            <span class="cs-header-badge">${project.badgeText || 'WEB DEVELOPMENT'}</span>

            <span style="font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.6); text-transform: uppercase;">⏱ ${project.timeline}</span>
          </div>

          <h1 class="cs-detail-title">${project.title}</h1>
          <p class="cs-detail-tagline">${project.tagline}</p>

          <!-- KEY METRICS BAR -->
          <div class="cs-detail-stats-bar">
      `;

      project.stats.forEach((stat, idx) => {
        let label = 'Measured Uplift';
        let sub = 'Verified Benchmark';
        if (idx === 0) { label = 'Primary Growth Driver'; sub = 'Peak Measured Result'; }
        if (idx === 1) { label = 'Performance Benchmark'; sub = 'Target Achievement'; }
        if (idx === 2) { label = 'Business ROI Impact'; sub = 'Bottom-line Value'; }

        html += `
          <div class="cs-detail-stat-card" style="border-color: rgba(61, 61, 255, 0.3); background: linear-gradient(145deg, rgba(14, 17, 32, 0.95) 0%, rgba(7, 8, 18, 0.98) 100%); position: relative; overflow: hidden; padding: 22px 24px; border-radius: 16px;">
            <div style="position: absolute; top: -20px; right: -20px; width: 90px; height: 90px; background: radial-gradient(circle, rgba(0, 255, 170, 0.18) 0%, transparent 70%);"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
              <span style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #00d2ff;">${label}</span>
              <span style="font-size: 11px; color: #00ffaa; font-weight: bold;">▲ UP</span>
            </div>
            <div class="cs-stat-number" style="color: #00ffaa; font-size: clamp(28px, 3.8vw, 38px); font-weight: 800; line-height: 1.1; margin-bottom: 6px;">${stat}</div>
            <div class="cs-stat-label" style="font-size: 11.5px; color: rgba(255, 255, 255, 0.55); text-transform: uppercase; letter-spacing: 0.8px;">${sub}</div>
            <div style="width: 100%; height: 2px; background: linear-gradient(90deg, #00ffaa, #00d2ff, transparent); margin-top: 14px; border-radius: 2px;"></div>
          </div>
        `;
      });

      html += `
          </div>

          <!-- LIVE DEPLOYED PROJECT BUTTON BAR -->
          <div class="cs-live-btn-wrap" style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 36px;">
            <a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" class="cs-live-btn">
              <span>EXPLORE LIVE SITE DEMO</span>
              <span class="btn-icon">↗</span>
            </a>
            <a href="#architecture" class="btn-secondary" style="padding: 14px 24px; font-size: 13px; font-weight: 700; border-radius: 30px;">
              <span>VIEW ARCHITECTURE ↓</span>
            </a>
            <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.05); padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.12);">
              <span class="webdev-live-dot"></span>
              <span>Production URL: <strong style="color: #fff;">${domainName}</strong></span>
            </div>
          </div>
        </header>

        <!-- SHOWCASE INTERACTIVE BROWSER FRAME WITH TABS -->

              <span class="cs-browser-dot yellow"></span>
              <span class="cs-browser-dot green"></span>
            </div>
            <span class="cs-browser-url">🔒 ${project.liveUrl}</span>
            <div style="margin-left: auto; display: flex; gap: 8px;">

              <button id="tabBtnIframe" onclick="switchShowcaseTab('iframe')" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 12px; cursor: pointer;">Live Interactive Frame</button>

              <span style="font-family:var(--font-display, 'Barlow Condensed'); font-size:12px; letter-spacing:3px; color:#00ffaa; font-weight:800; text-transform:uppercase; margin-bottom:12px; display:block;">✦ LIVE WEB APPLICATION PREVIEW</span>
              <h2 style="font-family:var(--font-display, 'Barlow Condensed'); font-size: clamp(26px, 3.8vw, 42px); font-weight:800; color:#ffffff; text-transform:uppercase; margin-bottom:12px; line-height: 1.1;">${project.title}</h2>
              <p style="font-size:15px; color:rgba(255,255,255,0.8); max-width:580px; margin: 0 auto 24px; line-height: 1.5;">${project.tagline}</p>
              
              <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;">
                ${project.techStack ? project.techStack.map(t => `<span style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.9); background: rgba(61, 61, 255, 0.25); border: 1px solid rgba(61, 61, 255, 0.4); padding: 5px 12px; border-radius: 14px;">${t}</span>`).join('') : ''}
              </div>

              <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; gap:10px; padding:12px 28px; border-radius:30px; background:#3D3DFF; color:#fff; font-size:13px; font-weight:800; text-decoration:none; font-family:var(--font-display, 'Barlow Condensed'); letter-spacing:1px; text-transform:uppercase; box-shadow:0 0 20px rgba(61,61,255,0.5);" onmouseover="this.style.background='#2a2aff'" onmouseout="this.style.background='#3D3DFF'">
                  <span>Launch Live Site</span>
                  <span>↗</span>
                </a>
                <button onclick="switchShowcaseTab('iframe')" style="display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:30px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:13px; font-weight:700; cursor:pointer;">
                  <span>Test Embedded App</span>
                  <span>🖥</span>
                </button>
              </div>
            </div>
          </div>

          <!-- TAB CONTENT 2: IFRAME PREVIEW -->
          <div id="tabContentIframe" style="display: none; width: 100%; height: 500px; background: #000; position: relative;">
            <iframe id="liveCaseStudyIframe" src="${project.liveUrl}" style="width: 100%; height: 100%; border: none;" title="${project.title} Preview"></iframe>
          </div>
        </div>

        <!-- STORY & NARRATIVE GRID -->
        <div class="cs-story-grid">
          <div>
            <!-- 01. THE CLIENT & CHALLENGE -->
            <div class="cs-story-box">
              <div class="cs-story-num">01 — THE CHALLENGE</div>
              <h2 class="cs-story-heading">Problem Statement &amp; Business Bottlenecks</h2>
              <p class="cs-story-p" style="margin-bottom: 24px;">${project.challenge}</p>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
                <div style="background: rgba(255, 80, 80, 0.08); border: 1px solid rgba(255, 80, 80, 0.25); border-radius: 12px; padding: 18px 20px;">
                  <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #ff6b6b; text-transform: uppercase; margin-bottom: 8px;">⚠️ Key Pain Points Identified</div>
                  <ul style="margin: 0; padding-left: 18px; font-size: 13px; color: rgba(255, 255, 255, 0.85); line-height: 1.6;">
                    ${painPointsList.map(p => `<li>${p}</li>`).join('')}
                  </ul>
                </div>
                <div style="background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.25); border-radius: 12px; padding: 18px 20px;">
                  <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #00d2ff; text-transform: uppercase; margin-bottom: 8px;">🎯 Target Project Goals</div>
                  <ul style="margin: 0; padding-left: 18px; font-size: 13px; color: rgba(255, 255, 255, 0.85); line-height: 1.6;">
                    ${targetGoalsList.map(g => `<li>${g}</li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>

            <!-- 02. OUR SOLUTION & STRATEGY -->
            <div class="cs-story-box" id="architecture">
              <div class="cs-story-num">02 — STRATEGY &amp; ARCHITECTURE</div>
              <h2 class="cs-story-heading">Engineering &amp; Design Approach</h2>
              <p class="cs-story-p" style="margin-bottom: 24px;">${project.solution}</p>

              <!-- 4-STEP WORKFLOW -->
              <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;">
                ${workflowPhases.map(w => `
                  <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px 16px;">
                    <div style="font-size: 11px; font-weight: 800; color: #00d2ff; margin-bottom: 4px;">${w.phase} — ${w.title}</div>
                    <div style="font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.9); line-height: 1.4;">${w.desc}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 03. KEY DELIVERABLES -->
            <div class="cs-story-box">
              <div class="cs-story-num">03 — KEY DELIVERABLES</div>
              <h2 class="cs-story-heading">Implemented Features &amp; Technical Assets</h2>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 16px;">
      `;

      project.features.forEach((f, index) => {
        const icons = ['⚡', '📱', '🔒', '🎨', '📈', '🔄', '🚀', '✨'];
        const icon = icons[index % icons.length];
        html += `
          <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 16px; display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.2s ease;" onmouseover="this.style.borderColor='rgba(61,61,255,0.4)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.08)'">
            <span style="font-size: 18px; background: rgba(61,61,255,0.2); padding: 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px;">${icon}</span>
            <div>
              <div style="font-size: 13.5px; font-weight: 700; color: #ffffff; line-height: 1.4; margin-bottom: 4px;">${f}</div>
              <span style="font-size: 10px; font-weight: 800; color: #00ffaa; letter-spacing: 0.5px; text-transform: uppercase;">✓ DEPLOYED &amp; VERIFIED</span>
            </div>
          </div>
        `;
      });

      html += `
              </div>
            </div>

            <!-- 04. MEASURED RESULTS & ROI -->
            <div class="cs-story-box" style="background: linear-gradient(135deg, rgba(16,20,40,0.95) 0%, rgba(8,10,20,0.98) 100%); border: 1px solid rgba(0, 255, 170, 0.3);">
              <div class="cs-story-num" style="color: #00ffaa;">04 — MEASURED ROI &amp; RESULTS</div>
              <h2 class="cs-story-heading">Business Impact &amp; Growth Performance</h2>
              <p class="cs-story-p" style="margin-bottom: 20px;">${project.results || 'The deployed application achieved immediate performance gains, reducing bounce rates and scaling organic customer inquiries dramatically.'}</p>
              
              <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <span style="font-size: 12px; font-weight: 800; color: #00ffaa; background: rgba(0,255,170,0.15); border: 1px solid rgba(0,255,170,0.3); padding: 8px 16px; border-radius: 20px;">✓ 100/100 Performance Score</span>
                <span style="font-size: 12px; font-weight: 800; color: #00d2ff; background: rgba(0,210,255,0.15); border: 1px solid rgba(0,210,255,0.3); padding: 8px 16px; border-radius: 20px;">✓ 100% Mobile Responsive</span>
                <span style="font-size: 12px; font-weight: 800; color: #a382ff; background: rgba(163,130,255,0.15); border: 1px solid rgba(163,130,255,0.3); padding: 8px 16px; border-radius: 20px;">✓ High Conversion UX</span>
              </div>
            </div>
          </div>

          <!-- SIDEBAR METADATA & TECH STACK -->
          <div>
            <div class="cs-story-box" style="position: sticky; top: 110px; background: rgba(10, 12, 22, 0.95); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 15px 40px rgba(0,0,0,0.5);">
              <div class="cs-story-num">PROJECT SPECIFICATIONS</div>
              
              <div style="margin-bottom:18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08);">
                <div style="font-size:11px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">CLIENT BRAND</div>
                <div style="font-weight:800; font-size:17px; color:#fff; font-family: var(--font-display); text-transform: uppercase;">${project.client}</div>
              </div>

              <div style="margin-bottom:18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08);">
                <div style="font-size:11px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">INDUSTRY VERTICAL</div>

              <div style="margin-bottom:18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08);">

      `;

      project.techStack.forEach(tech => {

      html += `

                <p style="font-size: 13px; font-style: italic; color: rgba(255, 255, 255, 0.85); line-height: 1.5; margin-bottom: 10px;">

        <div style="display:flex; align-items:center; justify-content:space-between; padding-top:30px; border-top:1px solid rgba(255,255,255,0.1); margin-top:40px; flex-wrap: wrap; gap: 16px;">

            <span>START A SIMILAR PROJECT</span>
            <span>→</span>
          </a>
        </div>
      `;

      container.innerHTML = html;

    // Helper to switch showcase frame tabs
    function switchShowcaseTab(tabName) {
      const overviewTab = document.getElementById('tabContentOverview');
      const iframeTab = document.getElementById('tabContentIframe');
      const btnOverview = document.getElementById('tabBtnOverview');
      const btnIframe = document.getElementById('tabBtnIframe');

      if (!overviewTab || !iframeTab) return;

      if (tabName === 'iframe') {
        overviewTab.style.display = 'none';
        iframeTab.style.display = 'block';
        btnOverview.style.background = 'rgba(255,255,255,0.06)';
        btnOverview.style.borderColor = 'rgba(255,255,255,0.12)';
        btnOverview.style.color = 'rgba(255,255,255,0.7)';

        btnIframe.style.background = 'rgba(61,61,255,0.3)';
        btnIframe.style.borderColor = 'rgba(61,61,255,0.5)';
        btnIframe.style.color = '#fff';
      } else {
        iframeTab.style.display = 'none';
        overviewTab.style.display = 'flex';
        btnIframe.style.background = 'rgba(255,255,255,0.06)';
        btnIframe.style.borderColor = 'rgba(255,255,255,0.12)';
        btnIframe.style.color = 'rgba(255,255,255,0.7)';

        btnOverview.style.background = 'rgba(61,61,255,0.3)';
        btnOverview.style.borderColor = 'rgba(61,61,255,0.5)';
        btnOverview.style.color = '#fff';
      }
    }
  </script>
